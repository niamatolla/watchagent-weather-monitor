services:
  api:
    build: .
    env_file:
      - .env
    environment:
      POLLER_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5

  poller:
    build: .
    env_file:
      - .env
    environment:
      POLLER_ENABLED: "true"
    volumes:
      - ./data:/app/data
    command: python -m app.services.poller
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
